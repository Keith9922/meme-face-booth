name: 队友招募墙 · 同步飞书数据

# 手动触发。跑完会把 teamup/src/data/wall.json 更新并提交，
# Vercel 监听到这次 push 就会自动重新部署 —— 这就是「更新数据」的完整链路。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只拉取和打印差异，不提交'
        type: boolean
        default: false

concurrency:
  group: teamup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从飞书多维表格拉取
        working-directory: teamup
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo "::error::缺少 FEISHU_APP_ID / FEISHU_APP_SECRET secret，见 teamup/README.md「更新数据」一节"
            exit 1
          fi
          npm run sync:api

      - name: 看看变了什么
        id: diff
        run: |
          if git diff --quiet -- teamup/src/data/wall.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据没有变化。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- teamup/src/data/wall.json
          fi

      - name: 构建一遍，确认新数据不会把页面搞挂
        if: steps.diff.outputs.changed == 'true'
        working-directory: teamup
        run: |
          npm ci
          npm run build

      - name: 提交
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run == false
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamup/src/data/wall.json
          git commit -m "chore(teamup): 同步飞书队友招募墙数据"
          git push
